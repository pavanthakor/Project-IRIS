services:
  - type: web
    name: iris-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: iris-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: iris-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://iris-frontend.vercel.app,http://localhost:5174,http://localhost:5173
      - key: VIRUSTOTAL_API_KEY
        sync: false
      - key: ABUSEIPDB_API_KEY
        sync: false
      - key: SHODAN_API_KEY
        sync: false
      - key: IPINFO_API_KEY
        sync: false
      - key: ZEROBOUNCE_API_KEY
        sync: false
      - key: FEED_VIRUSTOTAL_ENABLED
        value: "true"
      - key: FEED_ABUSEIPDB_ENABLED
        value: "true"
      - key: FEED_SHODAN_ENABLED
        value: "true"
      - key: FEED_IPINFO_ENABLED
        value: "true"
      - key: FEED_ZEROBOUNCE_ENABLED
        value: "true"
      - key: CACHE_ENABLED
        value: "true"
      - key: AUTH_REQUIRED
        value: "true"

databases:
  - name: iris-postgres
    databaseName: threat_intel
    user: postgres
    plan: free

  - name: iris-redis
    plan: free
